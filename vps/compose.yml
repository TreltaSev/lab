services:
  caddy:
    container_name: vps-caddy
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro # Config
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
