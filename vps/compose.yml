services:
  velocity:
    container_name: vps-velocity
    image: eclipse-temurin:21-jre
    working_dir: /velocity
    volumes:
      - ./velocity:/velocity
    command: ["java", "-Xms512M", "-Xmx1G", "-jar", "velocity.jar"]
    ports:
      - "25565:25565/tcp" # Minecraft
    restart: unless-stopped

  caddy:
    container_name: vps-caddy
    build: 
      context: ./caddy
      dockerfile: ./caddy/Dockerfile
    ports:
      - "80:80"   # HTTP
      - "443:443" # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro # Config
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: